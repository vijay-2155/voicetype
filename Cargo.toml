[package]
name = "voicetype"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
cosmic-text = "0.19"
eframe = { version = "0.37.0", default-features = false, features = ["wayland", "glow", "default_fonts"] }
ksni = { version = "0.3.7", features = ["blocking"] }
nnnoiseless = { version = "0.5.2", default-features = false }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12"
wayland-client = "0.31"
whisper-rs = "0.16"

[features]
vulkan = ["whisper-rs/vulkan"]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
